 ensure development remains on track.</li>\n<li>Follow SDLC processes and participate in Agile / SCRUM meetings, tasking / sizing work, participating to find alternative solutions to meet requirements and escalating issues throughout the sprint.</li>\n<li>Work with team to breakdown stories if needed to ensure they are sprint sized deliverables and apply effort to ensure stories are completed as agreed upon during the sprint planning sessions.</li>\n<li>Collaborate with vendors and develop proof of concept solutions</li>\n<li>Research technical problems and suggests improvements for web applications</li>\n<li>Lead development effort for tasks/initiatives to ensure they meet with business objectives.</li>\n<li>Design and Architect new solutions to be utilized as a standard where a template is not available.</li>\n<li>Perform other job-related duties as assigned.</li>\n</ul>\n<p>&nbsp;</p>\n<p><strong>What you will need:</strong></p>\n<ul>\n<li>Bachelor's Degree in Engineering, Information Technology, Computer Information Systems or related field (<strong>preferred</strong>) OR&nbsp;equivalent combination of education and experience <strong>required.</strong></li>\n<li>3+ years' experience in web programming, specifically planning and delivering software solutions required.</li>\n<li>3+ years' experience using C#, JavaScript, HTML and CSS <strong>required</strong>.</li>\n<li>Demonstrated competency using C#, JavaScript, HTML and CSS <strong>required</strong>.</li>\n<li>Demonstrated competency using Web API or RESTful web services <strong>required</strong>.</li>\n<li>Experience using JS Frameworks (vue.js, react), Dependency Injection and Object Relational Mapper (Entity Framework) and Content Management System (Optimizely, WordPress) <strong>required</strong>.</li>\n<li>Knowledge of object-oriented programming concepts and their use in client-side web applications, interfaces and databases <strong>required</strong>.</li>\n<li>Demonstrated understanding of architecture, organization and consistently follows coding standards required.</li>\n<li>Demonstrated ability to work independently with complex tasks while meeting assignment deadlines and quality inspections consistently <strong>required</strong>.</li>\n<li>Ability to foster an environment that promotes the exchange of information and successful accomplishment of shared goals with business stakeholders, IT service peers, and vendor partners <strong>required</strong>.</li>\n<li>Analytical, mathematical, and creative problem-solving skills <strong>required</strong>.</li>\n<li>Excellent listening, interpersonal, written and oral communication skills<strong> required</strong>.</li>\n<li>Ability to effectively prioritize and execute tasks while under pressure <strong>required</strong>.</li>\n<li>Strong customer service skills <strong>required</strong>.</li>\n<li>Willingness to travel up to 10% <strong>required</strong>.</li>\n<li>Knowledge of test-driven development, unit test and integration test development <strong>preferred</strong>.</li>\n<li>Microsoft Certifications <strong>preferred</strong>.</li>\n<li>PCI or ITIL Certifications <strong>preferred</strong>.</li>\n<li>Experience working in the Credit Union industry <strong>preferred</strong>.</li>\n</ul>\n<p>&nbsp;</p>\n<p>We are proud to be an EEO/AA employer M/F/D/V. We maintain a drug-free workplace and perform pre-employment substance abuse testing.</p>\n<p>For additional information about our organization, careers, and benefits visit: http://www.desertfinancial.com/careers.</p>\n<p>&nbsp;</p>\n<p>Location: Phoenix</p>\n<p>Job Type: Hybrid</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>#LI-Hybrid</p>", "EqualOpportunityEmployerDescription": "Equal Opportunity Employer<br>\r\nThis employer is required to notify all applicants of their rights pursuant to federal employment laws.\r\nFor further information, please review the <a href='https://www.eeoc.gov/poster' target='_blank'>Know Your Rights</a> notice from the Department of Labor.
