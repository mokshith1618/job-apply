name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest  # same OS as my PC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m ruff check .
      # No Chrome, Excel or Google Sheet needed: the tests block the real browser and Sheet,
      # build a fake tracker, and skip the real-Excel check when Excel is missing.
      - run: python -m pytest -q -rs
